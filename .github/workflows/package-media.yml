name: Package media3 git dir

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original FongMi libass source and its native submodules
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: 9dae39e9689ee305c83f94bd11cf3bcecb9d6171
          path: media3-ass
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false     # 关键：不把 token 写进 .git/config

      - name: Create ZIP archive (.git only)
        run: |
          zip -r media3-git.zip media3-ass/.git
          ls -lh media3-git.zip
          unzip -l media3-git.zip | head -30

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: media3-git-dir
          path: media3-git.zip
          retention-days: 30
