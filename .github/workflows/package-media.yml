name: Probe commit branch

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET: 9dae39e9689ee305c83f94bd11cf3bcecb9d6171
      REPO: FongMi/media

    steps:
      - name: Which branch HEAD is on this commit (API)
        run: |
          echo "== branches-where-head =="
          gh api "repos/$REPO/commits/$TARGET/branches-where-head" --jq '.[].name' || true

      - name: Which branch(es) contain this commit (ls-remote)
        run: |
          echo "== branch HEAD == target =="
          git ls-remote --heads "https://github.com/$REPO.git" | grep "$TARGET" || echo "(no branch HEAD points to $TARGET)"

      - name: List all branches
        run: |
          echo "== all branches =="
          git ls-remote --heads "https://github.com/$REPO.git" | sed 's#.*refs/heads/##'

      - name: Check if it's a tag
        run: |
          echo "== tags pointing at target =="
          git ls-remote --tags "https://github.com/$REPO.git" \
            | grep "$TARGET" || echo "(no tag points to $TARGET)"
