name: Package FongMi exoplayer_libass

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original FongMi libass source and its native submodules
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: 9dae39e9689ee305c83f94bd11cf3bcecb9d6171
          path: media3-ass
          fetch-depth: 1
          submodules: recursive

      # 只清目标目录内的 .git（如果它是 submodule，会有 .git gitfile）
      - name: Strip .git metadata
        run: |
          find media3-ass/libraries/exoplayer_libass -name ".git" -exec rm -rf {} + 2>/dev/null || true

      - name: Create ZIP archive
        run: |
          zip -r exoplayer_libass.zip media3-ass/libraries/exoplayer_libass
          ls -lh exoplayer_libass.zip

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exoplayer-libass-source
          path: exoplayer_libass.zip
          retention-days: 30
